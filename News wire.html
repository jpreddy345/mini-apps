<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WIRE</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23161513'/%3E%3Ccircle cx='50' cy='38' r='8' fill='%23B8342E'/%3E%3Ctext x='50' y='75' font-family='monospace' font-size='16' fill='%23F7F5F1' text-anchor='middle' font-weight='bold'%3EWIRE%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="WIRE">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root {
    --paper: #F7F5F1;
    --ink: #161513;
    --ink-soft: #4a4844;
    --rule: #d8d4cc;
    --signal: #B8342E;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    min-height: 100vh;
  }

  .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }

  header {
    border-bottom: 2px solid var(--ink);
    padding: 20px 20px 14px;
    max-width: 760px;
    margin: 0 auto;
    position: sticky;
    top: env(safe-area-inset-top);
    background: var(--paper);
    z-index: 10;
  }

  .masthead-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .wordmark {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.24em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--signal);
    animation: pulse 2s ease-in-out infinite;
    flex-shrink: 0;
  }
  .dot.loading { background: var(--ink-soft); animation: spin-pulse 0.8s ease-in-out infinite; }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  @keyframes spin-pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }

  .refresh-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    background: none;
    border: 1px solid var(--ink);
    color: var(--ink);
    padding: 6px 10px;
    border-radius: 3px;
    cursor: pointer;
  }
  .refresh-btn:active { background: var(--ink); color: var(--paper); }

  .status-row {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  .filters {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 14px 0 6px;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }

  .filter-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    padding: 6px 12px;
    border: 1px solid var(--rule);
    border-radius: 20px;
    background: transparent;
    color: var(--ink-soft);
    white-space: nowrap;
    cursor: pointer;
  }
  .filter-chip.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .item {
    padding: 20px 0;
    border-bottom: 1px solid var(--rule);
    display: block;
    text-decoration: none;
    color: inherit;
  }
  .item:active { background: rgba(0,0,0,0.03); }
  .item:first-child { padding-top: 8px; }

  .item-meta {
    font-size: 10px;
    letter-spacing: 0.07em;
    color: var(--signal);
    text-transform: uppercase;
    margin-bottom: 7px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .item-meta .src { color: var(--ink-soft); }
  .item-meta .src::before { content: "·"; margin-right: 8px; color: var(--rule); }
  .item-meta .time { color: var(--ink-soft); margin-left: auto; }

  .item h2 {
    margin: 0;
    font-size: 18px;
    font-weight: 400;
    line-height: 1.34;
  }

  .empty, .loading-msg {
    padding: 60px 0;
    text-align: center;
    color: var(--ink-soft);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
  }

  footer {
    max-width: 760px;
    margin: 0 auto;
    padding: 16px 20px 40px;
    border-top: 2px solid var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
    text-align: center;
  }

  ::selection { background: var(--ink); color: var(--paper); }
</style>
</head>
<body>

<header>
  <div class="masthead-row">
    <span class="wordmark"><span class="dot" id="statusDot"></span>WIRE</span>
    <button class="refresh-btn mono" id="refreshBtn">REFRESH</button>
  </div>
  <div class="status-row">
    <span id="statusText" class="mono">loading feed…</span>
    <span id="lastUpdated" class="mono"></span>
  </div>
</header>

<main>
  <div class="filters" id="filters"></div>
  <div id="feed">
    <div class="loading-msg">Fetching live headlines…</div>
  </div>
</main>

<footer>
  LIVE FEED · TECHCRUNCH · THE VERGE · ARS TECHNICA · HACKER NEWS<br>
  Save this page to your home screen for one-tap access.
</footer>

<script>
const SOURCES = [
  { name: "TechCrunch", url: "https://techcrunch.com/feed/" },
  { name: "The Verge", url: "https://www.theverge.com/rss/index.xml" },
  { name: "Ars Technica", url: "https://feeds.arstechnica.com/arstechnica/index" },
  { name: "Hacker News", url: "https://hnrss.org/frontpage" }
];

const PROXY = "https://api.rss2json.com/v1/api.json?rss_url=";

let allItems = [];
let activeFilter = "ALL";

const feedEl = document.getElementById('feed');
const filtersEl = document.getElementById('filters');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const lastUpdated = document.getElementById('lastUpdated');
const refreshBtn = document.getElementById('refreshBtn');

function timeAgo(dateStr) {
  const diff = Math.floor((Date.now() - new Date(dateStr).getTime()) / 60000);
  if (diff < 1) return "just now";
  if (diff < 60) return diff + "m ago";
  const h = Math.floor(diff / 60);
  if (h < 24) return h + "h ago";
  return Math.floor(h / 24) + "d ago";
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function fetchSource(src) {
  try {
    const res = await fetch(PROXY + encodeURIComponent(src.url));
    const data = await res.json();
    if (data.status !== "ok") return [];
    return data.items.slice(0, 8).map(it => ({
      title: it.title,
      link: it.link,
      pubDate: it.pubDate,
      source: src.name
    }));
  } catch (e) {
    return [];
  }
}

function render() {
  const filtered = activeFilter === "ALL"
    ? allItems
    : allItems.filter(i => i.source === activeFilter);

  if (filtered.length === 0) {
    feedEl.innerHTML = '<div class="empty">No stories loaded yet.</div>';
    return;
  }

  feedEl.innerHTML = filtered.map(it => `
    <a class="item" href="${it.link}" target="_blank" rel="noopener">
      <div class="item-meta mono">
        <span class="src">${escapeHtml(it.source)}</span>
        <span class="time">${timeAgo(it.pubDate)}</span>
      </div>
      <h2>${escapeHtml(it.title)}</h2>
    </a>
  `).join('');
}

function renderFilters() {
  const names = ["ALL", ...SOURCES.map(s => s.name)];
  filtersEl.innerHTML = names.map(n =>
    `<button class="filter-chip mono ${n === activeFilter ? 'active' : ''}" data-name="${n}">${n}</button>`
  ).join('');
  filtersEl.querySelectorAll('.filter-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.name;
      renderFilters();
      render();
    });
  });
}

async function loadAll() {
  statusDot.classList.add('loading');
  statusText.textContent = "fetching…";
  refreshBtn.disabled = true;

  const results = await Promise.all(SOURCES.map(fetchSource));
  allItems = results.flat().sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

  statusDot.classList.remove('loading');
  refreshBtn.disabled = false;

  if (allItems.length === 0) {
    statusText.textContent = "feed unavailable — check connection";
    feedEl.innerHTML = '<div class="empty">Could not load stories. Tap refresh to retry.</div>';
    return;
  }

  statusText.textContent = allItems.length + " stories live";
  lastUpdated.textContent = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  renderFilters();
  render();
}

refreshBtn.addEventListener('click', loadAll);
loadAll();
</script>

</body>
</html>
