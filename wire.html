<!doctype html><html lang="en" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11100f"><meta name="description" content="Fast, privacy-friendly public-data mini apps."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>WIRE — Mini Apps</title><style>
:root{--bg:#f2f0eb;--surface:#fbfaf7;--surface2:#e8e3da;--ink:#171614;--muted:#6d675f;--line:#d7d1c6;--accent:#bd3c33;--green:#347e5b;--shadow:0 12px 32px rgba(29,25,20,.07)}html[data-theme="dark"]{--bg:#11100f;--surface:#1a1917;--surface2:#24221f;--ink:#f5f1e9;--muted:#aaa39a;--line:#34312d;--accent:#ef7168;--green:#63b78d;--shadow:0 14px 40px rgba(0,0,0,.24)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:980px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 20px calc(92px + env(safe-area-inset-bottom))}.topbar{position:sticky;top:0;z-index:10;margin:0 -8px;padding:10px 8px 14px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);display:flex;justify-content:space-between;align-items:center}.brand{font:800 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2em}.actions{display:flex;gap:8px}.btn{height:40px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:800 10px ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.btn.active,.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}.hero{padding:42px 0 24px}.eyebrow{font:800 10px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent);letter-spacing:.14em}.hero h1{font-size:clamp(48px,9vw,88px);letter-spacing:-.065em;line-height:.9;margin:14px 0 18px}.hero p{font-family:Georgia,serif;color:var(--muted);font-size:20px;line-height:1.5;max-width:620px;margin:0}.statusbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-top:22px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}.live{display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}.dot.busy{animation:pulse 1s infinite;background:var(--accent)}@keyframes pulse{50%{opacity:.3}}.toolbar{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin:8px 0 14px}.search{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0 15px;font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace}.search:focus{outline:2px solid var(--accent);outline-offset:2px}.filters{display:flex;gap:7px;overflow:auto;padding:0 0 16px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);padding:9px 12px;font:800 9px ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer}.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}.feed{display:grid;gap:10px}.item{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 54px 20px 20px;box-shadow:var(--shadow);transition:.18s}.item:hover{transform:translateY(-2px);border-color:var(--ink)}.item a{color:inherit;text-decoration:none}.meta{display:flex;gap:8px;align-items:center;font:800 9px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;color:var(--accent);letter-spacing:.06em}.meta .time{margin-left:auto;color:var(--muted)}.item h2{font-family:Georgia,serif;font-weight:400;font-size:clamp(19px,3vw,25px);line-height:1.3;margin:11px 0 0}.save{position:absolute;right:14px;top:14px;width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:var(--bg);color:var(--muted);font-size:17px;cursor:pointer}.save.saved{color:var(--accent)}.desc{font-family:Georgia,serif;font-size:14px;line-height:1.5;color:var(--muted);margin:8px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.empty{padding:70px 18px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted);font:700 11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}.skeleton{height:145px;border-radius:16px;background:linear-gradient(100deg,var(--surface) 35%,var(--surface2) 50%,var(--surface) 65%);background-size:300% 100%;animation:shine 1.3s infinite}@keyframes shine{to{background-position:-100% 0}}.bottomnav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:6px;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);box-shadow:var(--shadow);z-index:20}.bottomnav a{padding:11px 15px;border-radius:999px;color:var(--muted);text-decoration:none;font:800 9px ui-monospace,SFMono-Regular,Menlo,monospace}.bottomnav a.active{background:var(--ink);color:var(--bg)}@media(max-width:620px){.shell{padding-left:14px;padding-right:14px}.hero{padding-top:30px}.hero h1{font-size:60px}.toolbar{grid-template-columns:1fr}.toolbar .btn{display:none}.actions .homeText{display:none}.item{padding-left:16px}.statusbar{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="shell"><header class="topbar"><div class="brand">WIRE</div><div class="actions"><a class="btn" href="index.html"><span class="homeText">HOME</span><span>⌂</span></a><button class="btn" id="savedBtn">SAVED <span id="savedCount">0</span></button><button class="btn primary" id="refreshBtn">REFRESH</button></div></header><section class="hero"><div class="eyebrow">TECHNOLOGY NEWS, WITHOUT THE NOISE</div><h1>What changed?</h1><p>Fresh headlines from trusted technology sources, arranged by time and easy to save for later.</p><div class="statusbar"><span class="live"><span class="dot busy" id="statusDot"></span><span id="statusText">FETCHING HEADLINES</span></span><span id="updated">—</span></div></section><section class="toolbar"><input id="search" class="search" type="search" placeholder="Search headlines…" autocomplete="off"><button class="btn" id="clearBtn">CLEAR</button></section><div class="filters" id="filters"></div><section class="feed" id="feed"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></section></main><nav class="bottomnav" aria-label="Mini Apps"><a href="index.html">HOME</a><a class="active" href="wire.html">WIRE</a><a href="ticker.html">TICKER</a></nav><script>
const SOURCES=[{name:'TechCrunch',url:'https://techcrunch.com/feed/'},{name:'The Verge',url:'https://www.theverge.com/rss/index.xml'},{name:'Ars Technica',url:'https://feeds.arstechnica.com/arstechnica/index'},{name:'Hacker News',url:'https://hnrss.org/frontpage'}],CACHE='wire_cache_v5',SAVED='wire_saved_v4';
const store={get:(k,f=null)=>{try{const v=localStorage.getItem(k);return v===null?f:JSON.parse(v)}catch{return f}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let items=[],seenLinks=new Set(),filter='ALL',savedOnly=false;const $=s=>document.querySelector(s),feed=$('#feed'),saved=new Set(store.get(SAVED,[]));
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function safeUrl(v){try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:'#'}catch{return'#'}}function ago(d){const ts=new Date(d).getTime();if(!Number.isFinite(ts))return'RECENT';const m=Math.max(0,Math.floor((Date.now()-ts)/60000));return m<1?'NOW':m<60?m+'M':m<1440?Math.floor(m/60)+'H':Math.floor(m/1440)+'D'}function stripHtml(v=''){return v.replace(/<[^>]*>/g,' ').replace(/&(?:#\d+|#x[\da-f]+|[a-z]+);/gi,' ').replace(/\s+/g,' ').trim().slice(0,300)}
async function requestNotifyPermission(){if('Notification'in window&&Notification.permission==='default')await Notification.requestPermission()}
function notifyNew(newItems){if(!('Notification'in window)||Notification.permission!=='granted'||!newItems.length)return;const n=new Notification('WIRE — '+newItems.length+' new stor'+(newItems.length===1?'y':'ies'),{body:newItems[0].title,icon:'./icon.svg',tag:'wire-update'});n.onclick=()=>{window.focus();n.close()}}
async function timedFetch(url,opts={},ms=9000){const c=new AbortController(),id=setTimeout(()=>c.abort(),ms);try{return await fetch(url,{...opts,signal:c.signal})}finally{clearTimeout(id)}}
function parseXml(xml,source){const doc=new DOMParser().parseFromString(xml,'text/xml');if(doc.querySelector('parsererror'))return[];return [...doc.querySelectorAll('item, entry')].slice(0,12).map(node=>({title:(node.querySelector('title')?.textContent||'Untitled').trim(),link:(node.querySelector('link')?.getAttribute('href')||node.querySelector('link')?.textContent||'').trim(),pubDate:(node.querySelector('pubDate, published, updated')?.textContent||new Date().toISOString()).trim(),description:stripHtml(node.querySelector('description, summary')?.textContent||node.querySelector('content')?.textContent||''),source}))}
async function fetchSource(s){const attempts=[async()=>{const r=await timedFetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(s.url),{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();if(d.status!=='ok')throw Error();return(d.items||[]).slice(0,12).map(i=>({title:i.title||'Untitled',link:i.link,pubDate:i.pubDate,description:stripHtml(i.description||''),source:s.name}))},async()=>{const r=await timedFetch('https://api.allorigins.win/raw?url='+encodeURIComponent(s.url),{cache:'no-store'});if(!r.ok)throw Error();return parseXml(await r.text(),s.name)}];for(const attempt of attempts){try{const out=await attempt();if(out.length)return out}catch{}}return[]}
function persist(){store.set(SAVED,[...saved]);$('#savedCount').textContent=saved.size}function renderFilters(){const names=['ALL',...SOURCES.map(s=>s.name)];$('#filters').innerHTML=names.map(n=>`<button class="chip ${n===filter?'active':''}" data-source="${esc(n)}">${esc(n)}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.source;renderFilters();render()})}
function render(){const q=$('#search').value.trim().toLowerCase();const list=items.filter(x=>(filter==='ALL'||x.source===filter)&&(!q||x.title.toLowerCase().includes(q))&&(!savedOnly||saved.has(x.link)));feed.innerHTML=list.length?list.map(x=>`<article class="item"><button class="save ${saved.has(x.link)?'saved':''}" data-link="${encodeURIComponent(x.link)}" aria-label="${saved.has(x.link)?'Remove saved story':'Save story'}">${saved.has(x.link)?'★':'☆'}</button><a href="${safeUrl(x.link)}" target="_blank" rel="noopener noreferrer"><div class="meta"><span>${esc(x.source)}</span><span class="time">${ago(x.pubDate)}</span></div><h2>${esc(x.title)}</h2>${x.description?`<p class="desc">${esc(x.description)}</p>`:''}</a></article>`).join(''):`<div class="empty">${savedOnly?'No saved stories yet.<br>Tap the star on any headline to keep it here.':'No matching headlines.<br>Try another search or source.'}</div>`;document.querySelectorAll('.save').forEach(b=>b.onclick=()=>{const l=decodeURIComponent(b.dataset.link);saved.has(l)?saved.delete(l):saved.add(l);persist();render()})}
async function load(){statusDot.classList.add('busy');statusText.textContent=navigator.onLine?'FETCHING HEADLINES':'OFFLINE — CHECKING CACHE';refreshBtn.disabled=true;const prevLinks=new Set(items.map(x=>x.link));try{const results=await Promise.all(SOURCES.map(fetchSource));const fresh=results.flat().filter(x=>x.link&&x.title).sort((a,b)=>new Date(b.pubDate)-new Date(a.pubDate));if(fresh.length){if(prevLinks.size){const newItems=fresh.filter(x=>!prevLinks.has(x.link));notifyNew(newItems)}items=fresh;seenLinks=new Set(fresh.map(x=>x.link));store.set(CACHE,{at:Date.now(),items});statusText.textContent=items.length+' STORIES LIVE'}else{const cache=store.get(CACHE,{items:[]});items=cache.items||[];statusText.textContent=items.length?'SHOWING SAVED CACHE':'FEED TEMPORARILY UNAVAILABLE'}}finally{statusDot.classList.remove('busy');const now=new Date(),next=new Date(now.getTime()+3600000);updated.textContent='UPDATED '+now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' · NEXT '+next.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});refreshBtn.disabled=false;render()}}
$('#search').oninput=render;$('#clearBtn').onclick=()=>{$('#search').value='';filter='ALL';savedOnly=false;savedBtn.classList.remove('active');renderFilters();render()};savedBtn.onclick=()=>{savedOnly=!savedOnly;savedBtn.classList.toggle('active',savedOnly);render()};refreshBtn.onclick=load;addEventListener('online',load);persist();renderFilters();requestNotifyPermission();load();setInterval(load,3600000);if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
