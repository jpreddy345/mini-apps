<!doctype html><html lang="en" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11100f"><meta name="description" content="Fast, privacy-friendly public-data mini apps."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>TICKER — Mini Apps</title><style>
:root{--bg:#f2f0eb;--surface:#fbfaf7;--surface2:#e8e3da;--ink:#171614;--muted:#6d675f;--line:#d7d1c6;--accent:#bd3c33;--up:#347e5b;--down:#bd3c33;--shadow:0 12px 32px rgba(29,25,20,.07)}html[data-theme="dark"]{--bg:#11100f;--surface:#1a1917;--surface2:#24221f;--ink:#f5f1e9;--muted:#aaa39a;--line:#34312d;--accent:#ef7168;--up:#63b78d;--down:#ef7168;--shadow:0 14px 40px rgba(0,0,0,.24)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:980px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 20px calc(92px + env(safe-area-inset-bottom))}.topbar{position:sticky;top:0;z-index:10;margin:0 -8px;padding:10px 8px 14px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);display:flex;justify-content:space-between;align-items:center}.brand{font:800 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2em}.actions{display:flex;gap:8px}.btn{height:40px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:800 10px ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}.hero{padding:42px 0 20px}.eyebrow{font:800 10px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent);letter-spacing:.14em}.hero h1{font-size:clamp(48px,9vw,88px);letter-spacing:-.065em;line-height:.9;margin:14px 0 18px}.hero p{font-family:Georgia,serif;color:var(--muted);font-size:20px;line-height:1.5;max-width:640px;margin:0}.marketbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-top:22px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}.marketstatus{display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}.dot.open{background:var(--up)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.metric{padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}.metric label{display:block;font:800 9px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);letter-spacing:.08em}.metric strong{display:block;font-size:22px;margin-top:8px}.controls{display:grid;grid-template-columns:1fr auto;gap:10px;margin:16px 0 10px}.add{display:flex;gap:8px}.add input{min-width:0;flex:1;height:48px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0 15px;font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase}.add input:focus{outline:2px solid var(--accent);outline-offset:2px}.add button{border:0;border-radius:14px;background:var(--ink);color:var(--bg);padding:0 18px;font:800 10px ui-monospace,SFMono-Regular,Menlo,monospace}.sorts{display:flex;gap:7px;overflow:auto;padding:0 0 14px;scrollbar-width:none}.sort{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);padding:9px 12px;font:800 9px ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer}.sort.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}.row a{color:inherit;text-decoration:none}.symbol{font:800 15px ui-monospace,SFMono-Regular,Menlo,monospace}.name{font-family:Georgia,serif;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.quote{text-align:right}.price{font:800 16px ui-monospace,SFMono-Regular,Menlo,monospace}.change{font:800 10px ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:5px}.up{color:var(--up)}.down{color:var(--down)}.remove{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:var(--bg);color:var(--muted);font-size:17px;cursor:pointer}.empty{padding:70px 18px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted);font:700 11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}.bottomnav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:6px;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);box-shadow:var(--shadow);z-index:20}.bottomnav a{padding:11px 15px;border-radius:999px;color:var(--muted);text-decoration:none;font:800 9px ui-monospace,SFMono-Regular,Menlo,monospace}.bottomnav a.active{background:var(--ink);color:var(--bg)}@media(max-width:620px){.shell{padding-left:14px;padding-right:14px}.hero{padding-top:30px}.hero h1{font-size:60px}.actions .homeText{display:none}.summary{grid-template-columns:1fr 1fr}.metric:last-child{grid-column:1/-1}.controls{grid-template-columns:1fr}.controls>.btn{display:none}.row{padding:15px;gap:10px}.name{max-width:155px}.marketbar{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="shell"><header class="topbar"><div class="brand">TICKER</div><div class="actions"><a class="btn" href="index.html"><span class="homeText">HOME</span><span>⌂</span></a><button class="btn" id="resetBtn">RESET</button><button class="btn primary" id="refreshBtn">REFRESH</button></div></header><section class="hero"><div class="eyebrow">YOUR MARKET WATCHLIST</div><h1>What moved?</h1><p>Track public symbols without exposing positions, balances, brokerage credentials, or transaction history.</p><div class="marketbar"><span class="marketstatus"><span class="dot" id="marketDot"></span><span id="marketText">CHECKING MARKET</span></span><span id="updated">—</span></div></section><section class="summary"><div class="metric"><label>WATCHING</label><strong id="watching">0</strong></div><div class="metric"><label>UP TODAY</label><strong class="up" id="upCount">—</strong></div><div class="metric"><label>TOP MOVER</label><strong id="topMover">—</strong></div></section><section class="controls"><div class="add"><input id="symbolInput" maxlength="10" placeholder="Add symbol — AAPL" autocomplete="off"><button id="addBtn">ADD</button></div><button class="btn" id="clearBtn">CLEAR ALL</button></section><div class="sorts"><button class="sort active" data-sort="custom">CUSTOM</button><button class="sort" data-sort="change">% CHANGE</button><button class="sort" data-sort="price">PRICE</button><button class="sort" data-sort="symbol">A–Z</button></div><section class="list" id="list"><div class="empty">Fetching public quotes…</div></section></main><nav class="bottomnav" aria-label="Mini Apps"><a href="index.html">HOME</a><a href="wire.html">WIRE</a><a class="active" href="ticker.html">TICKER</a></nav><script>
const DEFAULT=['NVDA','AMD','INTC','AMZN','MSFT','AVGO','VOO','QQQ','WMT','HOOD'],KEY='ticker_watchlist_v4',CACHE='ticker_cache_v4',API='https://query1.finance.yahoo.com/v7/finance/quote?symbols=';const store={get:(k,f=null)=>{try{const v=localStorage.getItem(k);return v===null?f:JSON.parse(v)}catch{return f}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};let symbols=store.get(KEY,DEFAULT.slice()),quotes={},sort='custom';if(!Array.isArray(symbols))symbols=DEFAULT.slice();symbols=[...new Set(symbols.map(String).filter(Boolean))].slice(0,40);const $=s=>document.querySelector(s);
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function save(){store.set(KEY,symbols);watching.textContent=symbols.length}async function timedFetch(url,ms=9000){const c=new AbortController(),id=setTimeout(()=>c.abort(),ms);try{return await fetch(url,{cache:'no-store',signal:c.signal})}finally{clearTimeout(id)}}
function market(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()),v=Object.fromEntries(parts.map(p=>[p.type,p.value])),mins=(Number(v.hour)%24)*60+Number(v.minute),open=!['Sat','Sun'].includes(v.weekday)&&mins>=570&&mins<960;marketText.textContent=open?'US MARKET OPEN':'US MARKET CLOSED';marketDot.classList.toggle('open',open)}function ordered(){const a=symbols.slice();if(sort==='symbol')a.sort();if(sort==='change')a.sort((x,y)=>(quotes[y]?.regularMarketChangePercent??-999)-(quotes[x]?.regularMarketChangePercent??-999));if(sort==='price')a.sort((x,y)=>(quotes[y]?.regularMarketPrice??-999)-(quotes[x]?.regularMarketPrice??-999));return a}function summary(){const qs=symbols.map(s=>quotes[s]).filter(Boolean),ups=qs.filter(q=>Number(q.regularMarketChangePercent)>0).length,top=qs.slice().sort((a,b)=>Math.abs(Number(b.regularMarketChangePercent||0))-Math.abs(Number(a.regularMarketChangePercent||0)))[0];watching.textContent=symbols.length;upCount.textContent=qs.length?ups:'—';topMover.textContent=top?top.symbol:'—'}
function render(){const a=ordered();list.innerHTML=a.length?a.map(s=>{const q=quotes[s];if(!q)return `<div class="row"><div><div class="symbol">${esc(s)}</div><div class="name">Quote unavailable</div></div><div class="quote"><div class="price">—</div><div class="change">NO DATA</div></div><button class="remove" data-s="${esc(s)}" aria-label="Remove ${esc(s)}">×</button></div>`;const p=Number(q.regularMarketPrice),c=Number(q.regularMarketChangePercent),valid=Number.isFinite(c),cl=!valid?'':c>=0?'up':'down';return `<div class="row"><div><a href="https://finance.yahoo.com/quote/${encodeURIComponent(s)}" target="_blank" rel="noopener noreferrer"><div class="symbol">${esc(s)}</div><div class="name">${esc((q.shortName||q.longName||'').slice(0,40))}</div></a></div><div class="quote"><div class="price">${Number.isFinite(p)?'$'+p.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):'—'}</div><div class="change ${cl}">${valid?(c>=0?'▲ +':'▼ ')+c.toFixed(2)+'%':'NO CHANGE DATA'}</div></div><button class="remove" data-s="${esc(s)}" aria-label="Remove ${esc(s)}">×</button></div>`}).join(''):'<div class="empty">Your watchlist is empty.<br>Add a public ticker symbol above.</div>';document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{symbols=symbols.filter(x=>x!==b.dataset.s);save();render()});summary()}
async function fetchQuotes(){const target=API+symbols.join(',');const urls=['https://corsproxy.io/?url='+encodeURIComponent(target),'https://api.allorigins.win/raw?url='+encodeURIComponent(target),target];for(const url of urls){try{const r=await timedFetch(url);if(!r.ok)throw Error();const d=await r.json();const rows=d.quoteResponse?.result||[];if(rows.length)return rows}catch{}}return[]}
async function load(){market();refreshBtn.disabled=true;if(!symbols.length){quotes={};render();refreshBtn.disabled=false;updated.textContent='EMPTY WATCHLIST';return}updated.textContent=navigator.onLine?'FETCHING QUOTES':'OFFLINE — CHECKING CACHE';try{const rows=await fetchQuotes();if(rows.length){quotes={};rows.forEach(q=>quotes[q.symbol]=q);store.set(CACHE,{at:Date.now(),quotes});updated.textContent='UPDATED '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}else{const cache=store.get(CACHE,{quotes:{}});quotes=cache.quotes||{};updated.textContent=Object.keys(quotes).length?'SHOWING SAVED CACHE':'QUOTE FEED TEMPORARILY UNAVAILABLE'}}finally{refreshBtn.disabled=false;render()}}
function add(){const s=symbolInput.value.trim().toUpperCase().replace(/[^A-Z0-9.^-]/g,'').slice(0,12);if(s&&!symbols.includes(s)&&symbols.length<40){symbols.push(s);save();symbolInput.value='';load()}else if(symbols.includes(s)){symbolInput.value=''}}addBtn.onclick=add;symbolInput.onkeydown=e=>{if(e.key==='Enter')add()};refreshBtn.onclick=load;resetBtn.onclick=()=>{symbols=DEFAULT.slice();save();load()};clearBtn.onclick=()=>{symbols=[];quotes={};save();render();updated.textContent='EMPTY WATCHLIST'};document.querySelectorAll('.sort').forEach(b=>b.onclick=()=>{sort=b.dataset.sort;document.querySelectorAll('.sort').forEach(x=>x.classList.toggle('active',x===b));render()});addEventListener('online',load);save();market();load();setInterval(market,60000);if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
